name: Lens to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['lens/**', 'protocol/**', '.github/workflows/lens-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build -w lens
      # Pages must be switched on once per repository with "GitHub Actions" as
      # the source (Settings → Pages); the built-in token cannot do that itself.
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: lens/dist
          # .well-known holds the manifest the glasses read for the app icon.
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@v4
